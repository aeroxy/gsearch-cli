[package]
name = "gsearch-cli"
version = "0.1.0"
edition = "2021"
description = "Standalone Google Search CLI powered by Gemini API, sharing auth with Gemini CLI."
authors = ["Aero <aero.windwalker@gmail.com>"]
license = "MIT"
repository = "https://github.com/aeroxy/gsearch-cli"
exclude = ["skill/", "wiki/", "AGENTS.md", "CLAUDE.md", "GEMINI.md"]

[[bin]]
name = "gsearch"
path = "src/main.rs"

[dependencies]
rand = "0.8"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
dirs = "5"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
base64 = "0.22"
urlencoding = "2.1"
open = "5.3"
